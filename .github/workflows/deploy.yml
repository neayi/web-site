name: Déploiement O2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      # Variable du dépôt (Settings > Secrets and variables > Actions > Variables) :
      # « true » si le compte FTP a pour racine le dossier du site lui-même.
      FTP_ACCOUNT_IS_SITE_ROOT: ${{ vars.FTP_ACCOUNT_IS_SITE_ROOT }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # FTPS plutôt que SSH : O2switch n'ouvre SSH qu'aux IP autorisées,
      # et celles des serveurs GitHub changent à chaque exécution.
      - name: Publication par FTPS
        # Ignorée tant que les secrets FTP ne sont pas configurés
        if: ${{ env.FTP_HOST != '' }}
        run: |
          # Garde-fou : mirror --delete efface tout ce qui n'est pas dans dist/.
          # La racine du compte FTP n'est acceptée que si le compte est limité au dossier du site.
          case "$FTP_REMOTE_DIR" in
            "")
              echo "FTP_REMOTE_DIR est vide."; exit 1 ;;
            "/"|"."|"./")
              if [ "$FTP_ACCOUNT_IS_SITE_ROOT" != "true" ]; then
                echo "FTP_REMOTE_DIR vise la racine du compte FTP. Si ce compte est limité au dossier du site,"
                echo "créez la variable de dépôt FTP_ACCOUNT_IS_SITE_ROOT=true ; sinon indiquez le dossier du site (ex. /www/)."
                exit 1
              fi ;;
          esac
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror --reverse --delete --parallel=4 --verbose=1 --exclude-glob .well-known/ dist/ \"$FTP_REMOTE_DIR\"
          "
